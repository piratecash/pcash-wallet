pluginManagement {
    repositories {
        gradlePluginPortal()
        google()
        mavenCentral()
    }
    buildscript {
        repositories {
            gradlePluginPortal()
            google()
            mavenCentral()
        }
    }
}

// Without this the name is taken from the checkout directory and leaks into
// the Kotlin module names of KMP modules, breaking reproducible builds.
rootProject.name = 'pcash-wallet-android'

include ':app'
include ':desktopApp'
include ':shared'
include ':baselineprofile'

include ':core:core'
include ':core:strings'
include ':core:resources'
include ':core:ui-compose'
include ':core:network'
include ':core:qr-multipart'
include ':core:wallet'
include ':core:navigation'
include ':components:icons'
include ':components:chartview'
include ':feature-stacking'
include ':feature-tangem'
include ':feature-trezor'
include ':feature-premium'
include ':feature-logging'
include ':feature-mini-app'
include ':config:detekt:rules'
include ':config:lint:checks'
