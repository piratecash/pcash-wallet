name: F-Droid Branch Sync and Build
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-and-build-fdroid:
    runs-on: ubuntu-latest
    permissions:
      contents: write # The last step force-pushes the rebased f-droid branch.
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true # The last step pushes with these credentials.

      - name: Configure Git
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "github-actions-bot@users.noreply.github.com"

      - name: Update f-droid branch locally
        run: |
          git checkout f-droid 2>/dev/null || git checkout -b f-droid
          
          git fetch origin master
          
          git rebase origin/master

      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit tests
        run: ./gradlew :app:testDebugUnitTest :core:wallet:testDebugUnitTest

      - name: Build with Gradle
        run: ./gradlew assembleDebug

      - name: Push changes to f-droid branch
        run: |
          git push --force-with-lease origin f-droid
