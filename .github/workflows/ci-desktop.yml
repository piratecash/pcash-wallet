name: Desktop CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: linux-x64
            format: deb
          - os: windows-2025
            artifact: windows-x64
            format: msi
          - os: macos-26
            artifact: macos-arm64
            format: dmg

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: "21"
          distribution: temurin
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # Write from every branch: repeated pushes to a pull request reuse its own outputs.
          cache-read-only: false
      - name: Build Desktop installer
        shell: bash
        run: ./gradlew :desktopApp:packageDistributionForCurrentOS -PdesktopPackageVersion=1.0.${{ github.run_number }} --build-cache
      - name: Upload Desktop installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.artifact }}
          path: desktopApp/build/compose/binaries/main/${{ matrix.format }}
          if-no-files-found: error
          retention-days: 30
