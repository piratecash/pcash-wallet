name: Android CI
on:
  push:
    branches:
      - master
      - "feature/**"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Restore Firebase DEV signing key
        env:
          FIREBASE_DEV_KEYSTORE_BASE64: ${{ secrets.FIREBASE_DEV_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$FIREBASE_DEV_KEYSTORE_BASE64" \
            | base64 --decode \
            > "$RUNNER_TEMP/firebase-dev.jks"
      - name: Run Unit tests
        run: ./gradlew :app:testDebugUnitTest :core:core:testDebugUnitTest :core:wallet:testDebugUnitTest :feature-premium:testDebugUnitTest :feature-logging:testDebugUnitTest :feature-trezor:testDebugUnitTest :feature-tangem:testDebugUnitTest
      - name: Stop Gradle daemon after tests
        run: ./gradlew --stop
      - name: Build QA and upload Crashlytics symbols
        run: |
          memory_monitor() {
            while true; do
              date -u '+%Y-%m-%dT%H:%M:%SZ' || true
              free -m || true
              ps -eo pid,ppid,rss,comm --sort=-rss | head -n 21 || true
              sleep 15 || return
            done
          }

          memory_monitor &
          monitor_pid=$!
          trap 'status=$?; kill "$monitor_pid" 2>/dev/null || true; wait "$monitor_pid" 2>/dev/null || true; exit "$status"' EXIT

          ./gradlew :app:assembleQa :app:uploadCrashlyticsSymbolFileQa --stacktrace --no-daemon
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          FIREBASE_DEV_KEYSTORE_PATH: ${{ runner.temp }}/firebase-dev.jks
          FIREBASE_DEV_STORE_PASSWORD: ${{ secrets.FIREBASE_DEV_STORE_PASSWORD }}
          FIREBASE_DEV_KEY_ALIAS: ${{ secrets.FIREBASE_DEV_KEY_ALIAS }}
          FIREBASE_DEV_KEY_PASSWORD: ${{ secrets.FIREBASE_DEV_KEY_PASSWORD }}
      - name: Verify Firebase DEV signing certificate
        run: |
          APKSIGNER="$(ls -1 "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)"
          ACTUAL_CERT_SHA256="$("$APKSIGNER" verify --print-certs app/build/outputs/apk/qa/app-qa.apk \
            | awk '/certificate SHA-256 digest:/ { print $NF; exit }')"
          test "$ACTUAL_CERT_SHA256" = "374992632abe227755163b21d0eec1e109767054ebb956bda9a7b79709a4eec2"
      - name: Archive QA APK and R8 metadata
        uses: actions/upload-artifact@v4
        with:
          name: qa-r8-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            app/build/outputs/apk/qa/app-qa.apk
            app/build/outputs/mapping/qa
            app/build/generated/res/injectCrashlyticsMappingFileIdQa
          if-no-files-found: error
          retention-days: 90
      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          file: app/build/outputs/apk/qa/app-qa.apk
          groups: testers
          releaseNotes: |
            Build: QA / R8 minified
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.event.head_commit.message }}
